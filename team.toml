# The default team formation. Override it with a TOML file of your own (same keys), layered in order:
#   this file  <  ~/.config/agent-team/team.toml (user)  <  ./agent-team.toml (project)  <  --config FILE
# Tables merge key by key, so `[members.backend-dev] model = "..."` changes only that model.
# `team.py init` copies this file to ./agent-team.toml for editing.
#
# Harnesses: claude, codex, pi, omp, opencode (v2+).
# The formation says who is on the team and how they work together. The project itself is
# briefed separately, after the team is up (`team.py say all --file project.md`).

# Top-level settings come first: in TOML, a key written after a [table] header belongs to that table.

# The PM's board of todos, owners, status, bugs and decisions, relative to the repo.
board = "TODO.md"

# Only the lead runs `git commit` / `git push`. Set false to let members commit when asked.
lead_commits = true

# How work flows, in order; part of the team briefing. Placeholders: {lead}, {board}, and a role
# name such as {reviewer}, which becomes the @names of the members with that role.
# A step that names a role nobody on the team has is left out.
workflow = [
  "{lead} sets direction and hands out tasks.",
  "{pm} records every task in `{board}` with an owner and status.",
  "{product} shapes scope and priorities with {lead} before big features start.",
  "Developers implement and leave their work uncommitted.",
  "{reviewer} reviews the diff first; developers fix what it finds.",
  "{qa-frontend} tests changed flows in a browser and reports bugs to {pm}.",
  "{qa-backend} tests changed endpoints and suites and reports bugs to {pm}.",
  "{lead} does the final review and commits.",
]

# The lead (orchestrator / CTO) is the agent you talk to: it launches and directs everyone below,
# and the human speaks through it. harness/model/thinking describe how to start it; team.py cannot
# change the model of the session it runs in.
[lead]
name = "cto"
harness = "claude"
model = "claude-fable-5-2"
thinking = "medium"
notes = "Orchestrator and lead architect. Owns architecture and the big decisions, hands out work, and does the final review. The human speaks through {lead}."

# Thinking levels never used, per harness, even if a member asks for them.
[never_thinking]
claude = ["max", "ultra"]
codex = ["max", "ultra"]

# Members: the table key is the agent's name and @mention (lowercase, digits, - or _). Fields:
#   role       a file in roles/ (defaults to the name, so [members.reviewer] is a reviewer)
#   harness    claude | codex | pi | omp | opencode. Omitted: inferred from the model
#              (Claude -> claude, GPT -> codex, anything else -> pi)
#   model      exact model id. Omitted: the role's tier from models.toml for that harness
#   tier       top | mid | fast, used only without a model
#   thinking   thinking level. Omitted: the role's default
#   notes      what this member owns on this team; shown in the team briefing
#   works_with members this one keeps posted, e.g. ["frontend-dev"]
# Two of the same role: give each its own name, e.g. [members.backend-dev-2] role = "backend-dev".

[members.architect]
harness = "claude"
model = "claude-fable-5-2"
thinking = "high"

[members.product]
harness = "claude"
model = "claude-opus-5-5"
thinking = "medium"

[members.lead-dev]
harness = "codex"
model = "gpt-6-luna"
thinking = "medium"
works_with = ["frontend-dev", "backend-dev"]

[members.backend-dev]
harness = "pi"
model = "z-ai/glm-5.3"
thinking = "medium"
works_with = ["lead-dev"]

[members.frontend-dev]
harness = "claude"
model = "claude-opus-5-5"
thinking = "medium"
works_with = ["lead-dev", "designer"]

[members.designer]
harness = "claude"
model = "claude-sonnet-5-5"
thinking = "high"
works_with = ["frontend-dev"]

[members.reviewer]
harness = "codex"
model = "gpt-6-astra"
thinking = "high"

[members.pm]
harness = "pi"
model = "deepseek/deepseek-v4.1-flash"
thinking = "low"

[members.qa-frontend]
harness = "claude"
model = "claude-sonnet-5-5"
thinking = "medium"

[members.qa-backend]
harness = "pi"
model = "z-ai/glm-5.3-flash"
thinking = "medium"

[members.runner]
harness = "pi"
model = "z-ai/glm-5.3-flash"
thinking = "low"

# Rosters. `team.py up` with no names launches `default`.
[teams]
default = ["lead-dev", "frontend-dev", "reviewer", "pm"]
planning = ["product", "architect", "pm"]
backend = ["lead-dev", "backend-dev", "qa-backend", "reviewer", "pm"]
frontend = ["frontend-dev", "designer", "qa-frontend", "reviewer", "pm"]
full = ["architect", "product", "lead-dev", "backend-dev", "frontend-dev", "designer", "reviewer", "pm", "qa-frontend", "qa-backend"]
