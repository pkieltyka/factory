name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Run tests
        run: |
          git config --global user.name "a-team CI"
          git config --global user.email "ci@example.invalid"
          python3 tests/test_ateam.py
