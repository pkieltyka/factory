name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Run tests
        run: |
          git config --global user.name "factory CI"
          git config --global user.email "ci@example.invalid"
          python3 tests/test_factory.py

  # LC-9 (#165), temporary: install the pinned hc release and run the live fixtures on the runner.
  hc-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install hc 0.1.20 (pinned, sha256-checked)
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          cd "$RUNNER_TEMP/hc"
          curl -fsSL --retry 3 -o hc.tar.gz https://releases.herdr.dev/core/0.1.20/herdr-core-linux-x86_64.tar.gz
          echo "ac6b86890c451a37584620aaa438b71bc0d0bd430a2e7c1d7e095f052c414e74  hc.tar.gz" | sha256sum -c
          tar -xzf hc.tar.gz
          ln -s herdr-core hc
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
      - name: hc version
        run: hc --version | grep -x 'hc 0.1.20'
      - name: Live fixtures on a private core
        run: python3 tests/live.py fixtures --out "$RUNNER_TEMP/fixtures.json"
      - name: Same reply keys as the committed fixtures
        run: |
          python3 - "$RUNNER_TEMP/fixtures.json" tests/hc_fixtures.json <<'PY'
          import json, sys
          def shape(v):
              if isinstance(v, dict):
                  return {k: shape(x) for k, x in v.items()}
              if isinstance(v, list):
                  return [shape(v[0])] if v and isinstance(v[0], dict) else "list"
              return "value"
          ci, committed = (json.load(open(p)) for p in sys.argv[1:])
          bad = [f"{part}.{name}" for part in ("replies", "errors")
                 for name in committed[part]
                 if shape(ci[part].get(name)) != shape(committed[part][name])]
          print("differ:", bad or "none")
          sys.exit(1 if bad else 0)
          PY
