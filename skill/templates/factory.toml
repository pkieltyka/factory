# Your formation: the operator and the members, each on its own harness and model. The operator is the lead
# agent; you, the user, are the owner who directs it. This file is yours and is not committed;
# factory.toml.sample is the project's suggestion. All roles are in the skill's roles/.
# A member needs harness + model; thinking defaults to its role's. Optional per member: role (for numbered
# names), notes (what it owns here), permissions, args (native flags), worktree (true: its own checkout on
# branch <user>/<name>; a branch name: that branch). The first member of a role has the role's name; more of
# that role are -2, -3, ... A name never changes.

# user = "peter"          # the first part of your worktree branches (peter/lead-dev); default: your system user
#                         # name. A top-level key: it goes here, above [operator]. Leave it out of factory.toml.sample.
# permissions = "guarded" # default "full": members never stop for approval, which assumes a safe machine.
#                         # guarded keeps Claude Code and Codex behind their own guard. See Permissions in the factory skill's references/cmd_setup.md.
# worktree_dir = "../<repo>.worktrees"

# quiet_grace = 120       # seconds before a quiet note (30 or more)
# ready_check = "items=$(awk '/^## / { ready = ($0 == \"## Ready\") } ready && /^- \\[ \\] \\([0-9]+\\)/ { print }' TODO.md) || exit 2; [ -n \"$items\" ] || exit 1; printf '%s\\n' \"$items\""
# Optional read-only command in your local factory.toml. Exit 0 with output means ready work.
# Exit 1 or exit 0 with empty output means none. Other exits mean unknown.
# ready_check_every = 300 # seconds between ready checks (60 or more)

[operator]
name = "operator"   # the operator agent's @name and pane title; fixed while the team runs
# Setup records this session’s harness, model and thinking in your local factory.toml.
notes = "Owns architecture, assigns tasks and integrates reviewed work."

[members.lead-dev]
harness = "codex"
model = "gpt-6-astra"
thinking = "high"

[members.reviewer]
harness = "codex"
model = "gpt-6-luna"
thinking = "high"

[members.pm]
harness = "pi"
model = "deepseek/deepseek-v4.1-flash-1017"
thinking = "high"

