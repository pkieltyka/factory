# One table per harness: what factory.py knows about it that is plain data. What cannot be data (listing its
# models, building its launch command) is that harness's block in scripts/factory.py.
#
#   label, install   the name in rosters; what to tell the user when the binary is missing
#   models       recommended models, strongest first; `factory.py harnesses` says which this machine can use.
#                Claude Code has no listing command, so for claude these are the ids `check` knows.
#   aliases      claude only: short names Claude Code takes in place of a model id ("opus")
#   default_model, default_thinking   agy member defaults, independent of the role
#   thinking     levels the harness accepts (codex: read per model from its cache; opencode: per-model variants)
#   never        levels factory refuses even where the harness accepts them
#   prompt       how a member gets its standing instructions: `file` (appended to the system prompt),
#                `pointer` (a system line names the file; the text also goes in the first message), `message`
#   operator_wake  background (native task completion) or queue (native CLI); omit for member-only harnesses
#   dialogs      start-up questions `up` answers itself: text on the screen, then the herdr keys that accept it
#   [x.permissions]  native flags per permission level. `full` (default) never stops for approval and adds no
#                sandbox. `guarded` keeps the harness's own guard; only Claude Code and Codex have one.

[claude]
operator_wake = "background"
label = "Claude Code"
install = "Install Claude Code (https://code.claude.com/docs) and log in once by running `claude`."
models = ["claude-fable-5-2", "claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
aliases = ["fable", "opus", "sonnet", "haiku"]
thinking = ["low", "medium", "high", "xhigh", "max"]
never = ["max"]
prompt = "file"

# Both questions start on "No, exit". The bypass warning is normally skipped by a setting `up` passes.
dialogs = [["Yes, I trust this folder", ["down", "enter"]], ["Yes, I accept", ["down", "enter"]]]

[claude.permissions]
full = ["--permission-mode", "bypassPermissions"]
guarded = ["--permission-mode", "auto"]   # a classifier reviews each action; it can still stop and ask

[codex]
operator_wake = "queue"
label = "Codex"
install = "Install the Codex CLI (`npm i -g @openai/codex`) and log in once by running `codex`."
models = ["gpt-6.2-astra", "gpt-6.2-sol", "gpt-6-astra", "gpt-6.1-sol", "gpt-6-luna", "gpt-6-sol"]
never = ["max", "ultra"]
prompt = "pointer"
dialogs = [["Trust and continue", ["enter"]]]   # asked once per new folder, a worktree included

# guarded: the workspace-write sandbox, with automatic review of what leaves it. Network access stays on:
# herdr's socket needs it, so without it a member cannot message anyone.
[codex.permissions]
full = ["--dangerously-bypass-approvals-and-sandbox"]
guarded = ["--approve-for-me", "-c", "sandbox_workspace_write.network_access=true"]

[pi]
label = "pi"
install = "Install pi (`npm i -g @earendil-works/pi-coding-agent`) and configure a provider (`pi auth --help`)."
models = ["openai/gpt-6-astra", "z-ai/glm-5.3", "moonshotai/kimi-k3", "x-ai/grok-4.7", "z-ai/glm-5.3-flash", "deepseek/deepseek-v4.1-flash-1017"]
thinking = ["off", "minimal", "low", "medium", "high", "xhigh", "max"]
never = []
prompt = "file"

[pi.permissions]   # pi has no sandbox and no approvals
full = []
guarded = []

[omp]
label = "omp"
install = "Install oh-my-pi so `omp` is on PATH, and configure a provider."
models = ["openai/gpt-6-astra", "z-ai/glm-5.3", "moonshotai/kimi-k3", "x-ai/grok-4.7", "z-ai/glm-5.3-flash", "deepseek/deepseek-v4.1-flash-1017"]
thinking = ["off", "minimal", "low", "medium", "high", "xhigh", "max", "auto"]
never = []
prompt = "file"

[omp.permissions]   # omp's stricter modes ask before every command, a message to a teammate included
full = ["--approval-mode", "yolo"]
guarded = ["--approval-mode", "yolo"]

[opencode]
operator_wake = "background"
label = "OpenCode"
install = "Install OpenCode v2 or later (https://opencode.ai) so `opencode` is on PATH."
models = ["openrouter/openai/gpt-6-astra", "openrouter/z-ai/glm-5.3", "openrouter/z-ai/glm-5.3-flash"]
never = []
prompt = "message"

[opencode.permissions]   # --auto approves whatever the user's own rules do not deny
full = ["--auto"]
guarded = ["--auto"]

[agy]
label = "Antigravity CLI"
default_model = "gemini-4-neon"
default_thinking = "high"
install = "Install Antigravity CLI and sign in by running `agy`."
models = ["gemini-4-neon", "gemini-4-argon", "gemini-4-hydrogen", "gemini-3.8-flash"]
thinking = ["low", "medium", "high", "xhigh", "max"]
never = []
prompt = "message"
dialogs = [["Do you trust the contents of this project?", ["enter"]]]

[agy.permissions]   # guarded equals full because agy's sandbox and auto mode do not work on NixOS
full = ["--mode", "accept-edits", "--settings", '{"toolPermission":"always-proceed"}']
guarded = ["--mode", "accept-edits", "--settings", '{"toolPermission":"always-proceed"}']
